spring:
  application:
    name: kharcha-backend-test
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: test-very-strong-secret-key-that-is-at-least-32-bytes-long!
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000
  cookie-secure: false

cors:
  allowed-origin: http://localhost:5173

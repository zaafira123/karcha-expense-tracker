server:
  port: 8080

spring:
  application:
    name: kharcha-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000 # 15 minutes
  refresh-token-expiration-ms: 604800000 # 7 days
  cookie-secure: true

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html

---
# Seed profile placeholder for populating demo / initial dataset
spring:
  config:
    activate:
      on-profile: seed
# Additional seed-specific configurations will be configured here

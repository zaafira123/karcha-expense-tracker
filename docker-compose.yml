services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kharcha
      POSTGRES_USER: ${DATABASE_USERNAME:-kharcha}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the environment or root .env file}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-kharcha} -d kharcha"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /app
    command: mvn spring-boot:run
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/kharcha
      DATABASE_USERNAME: ${DATABASE_USERNAME:-kharcha}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the environment or root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment or root .env file}
      JWT_COOKIE_SECURE: false
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      AI_ENABLED: ${AI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_DAILY_LIMIT_PER_USER: ${AI_DAILY_LIMIT_PER_USER:-20}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  maven-cache:
